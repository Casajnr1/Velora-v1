<style>
  /*=============================
        NAVBAR
==============================*/

body{

    font-family: 'Inter', sans-serif;
    background: #FAFAF8;

}

.velora-navbar{

    background: #FAFAF8;

    padding: 20px 0;

}

.logo{

    height: 42px;

}

.navbar-nav{

    gap: 18px;

}

.nav-link{

    color: #111111 !important;

    font-size: 15px;

    font-weight: 500;

    transition: .3s;

}

.nav-link:hover{

    color: #1F6F5B !important;

}

.nav-link.active{

    color: #1F6F5B !important;

}

.dashboard-btn{

    padding: 12px 24px;

    border-radius: 16px;

    text-decoration: none;

    background: #111111;

    color: #FAFAF8;

    font-weight: 600;

    transition: .3s;

}

.dashboard-btn:hover{

    background: #1F6F5B;

    color: #fff;

}

.navbar-toggler{

    padding: 0;

}

.navbar-toggler:focus{

    box-shadow: none;

}

@media(max-width:991px){

    .navbar-nav{

        gap: 0;

        padding: 20px 0;

    }

    .dashboard-btn{

        display: inline-flex;

        justify-content: center;

        margin-top: 10px;

    }

}
</style>
</head>

<!-- ==========================
        NAVBAR START
=========================== -->

<nav class="navbar navbar-expand-lg velora-navbar">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand" href="#">

        </a>

        <button class="navbar-toggler border-0 shadow-none"
            type="button"

            <ul class="navbar-nav mx-auto">

                </li>

                </li>
